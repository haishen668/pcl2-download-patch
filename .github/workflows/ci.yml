name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 语法校验（AST 解析）
        shell: pwsh
        run: |
          $fails = @()
          Get-ChildItem src/*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs.Count -gt 0) { $fails += "$($_.Name): $($errs[0].Message)" }
            else { Write-Host "OK $($_.Name)" }
          }
          if ($fails.Count) { $fails | ForEach-Object { Write-Host "FAIL $_" }; exit 1 }

      - name: Python 工具语法校验
        run: |
          python -m py_compile tools/pcl2_analyze.py && echo "OK tools/pcl2_analyze.py"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: C# 补丁器编译校验
        run: dotnet build src/Patcher -c Release

      - name: 确认仓库不含二进制
        run: |
          ! find . -path ./.git -prune -o -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.bak' \) -print | grep -q .
